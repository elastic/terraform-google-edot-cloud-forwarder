name: changelog-release

on:
  # TODO just to test
  pull_request:
  push:
    branches:
      - main
    paths:
      - .chloggen/*.yaml # only if a new changelog fragment was added

permissions:
  id-token: write

jobs:
  changelog-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # dismiss PRs from dependabot, elastic-renovate-prod and elastic-observability-automation
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'elastic-renovate-prod[bot]' && github.actor != 'elastic-observability-automation'}}
    steps:
      - name: Fetch ephemeral GitHub token to use with git commands
        uses: elastic/ci-gh-actions/fetch-github-token@v1.0.0
        id: fetch-token
        with:
          vault-instance: "ci-prod"

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        id: go-setup
        with:
          cache-dependency-path: "**/*.sum"
          go-version-file: 'tools/go.mod'

      # If there is no cache with the go tools, install them.
      - name: Install tools
        if: steps.go-setup.outputs.cache-hit != 'true'
        run: |
          make install-tools

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.fetch-token.outputs.token }}

      - name: Create/update release PR
        shell: bash
        run: ./.github/scripts/create_release_pr.sh
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
