name: changelog-fragments

on:
  pull_request:
    branches:
      - main
    paths:
      - modules/elastic-cloud-forwarder/*.tf

jobs:
  changelog-fragments:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    # dismiss PRs from dependabot, elastic-renovate-prod and elastic-observability-automation
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'elastic-renovate-prod[bot]' && github.actor != 'elastic-observability-automation'}}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # we need the commit history

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        id: go-setup
        with:
          cache-dependency-path: "**/*.sum"
          go-version-file: 'tools/go.mod'

      # If there is no cache with the go tools, install them.
      - name: Install tools
        if: steps.go-setup.outputs.cache-hit != 'true'
        run: |
          make install-tools

      - name: Ensure changelog is updated
        run: |
          if [[ 1 -gt $(git diff --diff-filter=A --name-only $(git merge-base origin/main $PR_HEAD) $PR_HEAD .chloggen | grep -c \\.yaml) ]]
          then
            echo "No changelog entry was added to the .chloggen directory. Please run `make chlog-new`."
            false
          else
            echo "A changelog entry was added to the .chloggen directory."
          fi

      - name: Validate .chloggen changes
        run: |
          make chlog-validate || { echo "New ./.chloggen/*.yaml file failed validation."; exit 1; }
