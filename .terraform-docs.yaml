formatter: markdown table

version: 0.20.0

recursive:
  enabled: true
  path: modules
  include-main: false

sections:
  show:
    - all

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  indent: 4
  escape: false
  default: false
  required: false
  type: true